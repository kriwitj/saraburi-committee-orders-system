version: "3.9"

# ─────────────────────────────────────────────────────────────
# SAROrders — Docker Compose สำหรับ Ubuntu Server
# Traefik proxy ที่ proxy_net รันแยกอยู่แล้วที่ /opt/apps/proxy
#
# การใช้งานครั้งแรก:
#   1. cp .env.example .env && nano .env
#   2. docker compose up -d --build
#   3. docker compose exec app npx drizzle-kit push
# ─────────────────────────────────────────────────────────────

services:
  # ──── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sarorders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sarorders
      POSTGRES_USER: sarorders
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarorders -d sarorders"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sarorders-net

  # ──── Next.js Application ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sarorders-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://sarorders:${DB_PASSWORD}@db:5432/sarorders
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NEXTAUTH_URL: https://${DOMAIN}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sarorders-net   # คุยกับ db
      - proxy_net       # ให้ Traefik กลาง discover ได้
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      # Route: DOMAIN → app:3000
      - "traefik.http.routers.sarorders.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.sarorders.entrypoints=websecure"
      - "traefik.http.routers.sarorders.tls=true"
      - "traefik.http.routers.sarorders.tls.certresolver=le"
      - "traefik.http.services.sarorders.loadbalancer.server.port=3000"

# ──── Networks ─────────────────────────────────────────────
networks:
  sarorders-net:
    name: sarorders-net
  proxy_net:
    external: true      # ใช้ network ที่ Traefik สร้างไว้แล้ว
    name: proxy_net

# ──── Named Volumes ────────────────────────────────────────
volumes:
  postgres_data:
    name: sarorders_postgres_data
  uploads:
    name: sarorders_uploads
