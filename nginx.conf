# ─────────────────────────────────────────────────────────────
# Nginx Reverse Proxy สำหรับ SAROrders
# วางไฟล์นี้ไว้ที่: /etc/nginx/sites-available/sarorders
# แล้วสร้าง symlink: ln -s /etc/nginx/sites-available/sarorders /etc/nginx/sites-enabled/
#
# หลังแก้ไข reload: sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name your-domain.com;  # ← เปลี่ยนเป็น domain จริง

    # Redirect HTTP → HTTPS (เปิดใช้เมื่อมี SSL certificate แล้ว)
    # return 301 https://$host$request_uri;

    # ─── Proxy to Next.js app ──────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Upload file size limit ───────────────────────────
    client_max_body_size 50M;

    # ─── Security headers ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

